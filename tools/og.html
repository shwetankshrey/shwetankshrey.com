<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>og</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #040810;
    --ink: #ECE3D2;
    --muted: #968B7B;
    --rule: #1A2235;
    --accent: #E0B660;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    --serif: 'Crimson Pro', 'EB Garamond', Georgia, serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    width: 1200px;
    height: 630px;
    display: grid;
    grid-template-columns: 1fr 380px;
    column-gap: 64px;
    padding: 80px;
    font-family: var(--mono);
  }
  .left {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-width: 0;
  }
  .wordmark {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  .name {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 76px;
    line-height: 1.05;
    letter-spacing: -0.015em;
    margin: 0 0 24px;
  }
  .name .accent { color: var(--accent); }
  .tagline {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 28px;
    line-height: 1.4;
    color: var(--ink);
    max-width: 24ch;
    margin: 0;
  }
  .url {
    font-family: var(--mono);
    font-size: 18px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .url::before {
    content: '— ';
    color: var(--accent);
  }
  .right {
    position: relative;
    align-self: end;
  }
  .portrait-frame {
    position: relative;
    width: 380px;
    height: 380px;
    overflow: hidden;
  }
  .portrait-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 35%;
    display: block;
  }
  .portrait-frame::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
      ellipse at 50% 45%,
      transparent 65%,
      color-mix(in srgb, var(--bg) 55%, transparent) 100%
    );
  }
</style>
</head>
<body>
  <div class="left">
    <div class="wordmark">t</div>
    <div>
      <h1 class="name">shwe<span class="accent">tank</span> shrey</h1>
      <p class="tagline">full-stack systems engineer who happens to be unusually comfortable down at silicon.</p>
    </div>
    <div class="url">shwetankshrey.com</div>
  </div>
  <div class="right">
    <div class="portrait-frame">
      <img src="http://localhost:4321/portrait.webp" alt="">
    </div>
  </div>
</body>
</html>
